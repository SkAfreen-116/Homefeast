<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | HomeFeast</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page">


<header class="navbar">

    <div class="container nav-container">

        <a href="index.html" class="logo">
            <span>🍲</span> HomeFeast
        </a>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="menu.html">
                Menu
            </a>

            <a href="login.html" class="active">
                Login
            </a>

            <a href="register.html" class="nav-register">
                Register
            </a>

        </nav>

    </div>

</header>


<main class="auth-container">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                🔐
            </div>

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to your HomeFeast account
            </p>

        </div>


        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <div class="form-options">

                <label class="checkbox-label">

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="btn btn-primary full-width">

                Login

            </button>


        </form>


        <div class="auth-divider">
            <span>OR</span>
        </div>


        <p class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>

    </div>

</main>


<script src="js/main.js"></script>

</body>
</html>
