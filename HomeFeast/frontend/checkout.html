<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout | HomeFeast</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<header class="navbar">

    <div class="container nav-container">

        <a href="index.html" class="logo">
            🍲 HomeFeast
        </a>

        <nav class="nav-links">

            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="cart.html">Cart</a>
            <a href="orders.html">Orders</a>

        </nav>

    </div>

</header>


<main>

    <section class="page-banner">

        <div class="container">

            <p class="section-label">
                ALMOST THERE
            </p>

            <h1>
                Checkout
            </h1>

            <p>
                Enter your delivery details and place your order.
            </p>

        </div>

    </section>


    <section class="section">

        <div class="container checkout-layout">


            <div class="checkout-form">

                <h2>
                    Delivery Address
                </h2>


                <form id="checkoutForm">

                    <div class="form-row">

                        <div class="form-group">

                            <label>
                                Full Name
                            </label>

                            <input
                                type="text"
                                placeholder="Your name"
                                required>

                        </div>


                        <div class="form-group">

                            <label>
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                placeholder="Your phone number"
                                required>

                        </div>

                    </div>


                    <div class="form-group">

                        <label>
                            House / Flat Number
                        </label>

                        <input
                            type="text"
                            placeholder="House or flat number"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Street / Area
                        </label>

                        <input
                            type="text"
                            placeholder="Street or area"
                            required>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label>
                                City
                            </label>

                            <input
                                type="text"
                                placeholder="City"
                                required>

                        </div>


                        <div class="form-group">

                            <label>
                                Pincode
                            </label>

                            <input
                                type="text"
                                placeholder="Pincode"
                                required>

                        </div>

                    </div>


                    <h2 class="payment-title">
                        Payment Method
                    </h2>


                    <div class="payment-options">

                        <label class="payment-option">

                            <input
                                type="radio"
                                name="payment"
                                value="cod"
                                checked>

                            <span>
                                💵 Cash on Delivery
                            </span>

                        </label>


                        <label class="payment-option">

                            <input
                                type="radio"
                                name="payment"
                                value="online">

                            <span>
                                💳 Online Payment
                            </span>

                        </label>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary full-width">

                        Place Order

                    </button>

                </form>

            </div>


            <div class="summary-card">

                <h2>
                    Order Summary
                </h2>


                <div class="checkout-food">

                    <span>
                        Chicken Biryani × 1
                    </span>

                    <strong>
                        ₹150
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Delivery
                    </span>

                    <strong>
                        ₹40
                    </strong>

                </div>


                <div class="summary-divider"></div>


                <div class="summary-total">

                    <span>
                        Total
                    </span>

                    <strong>
                        ₹190
                    </strong>

                </div>

            </div>

        </div>

    </section>

</main>


<script src="js/main.js"></script>

</body>
</html>
