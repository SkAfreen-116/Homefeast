<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | HomeFeast</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page">


<header class="navbar">

    <div class="container nav-container">

        <a href="index.html" class="logo">
            <span>🍲</span> HomeFeast
        </a>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="menu.html">
                Menu
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="register.html"
               class="nav-register active">
                Register
            </a>

        </nav>

    </div>

</header>


<main class="auth-container">

    <div class="auth-card register-card">

        <div class="auth-header">

            <div class="auth-icon">
                👤
            </div>

            <h1>
                Create Account
            </h1>

            <p>
                Join the HomeFeast community
            </p>

        </div>


        <form id="registerForm">


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    placeholder="Enter your phone number"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Create a password"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Register As
                </label>

                <select required>

                    <option value="">
                        Select account type
                    </option>

                    <option value="customer">
                        Customer
                    </option>

                    <option value="seller">
                        Home Cook / Seller
                    </option>

                </select>

            </div>


            <label class="checkbox-label terms">

                <input type="checkbox" required>

                I agree to the Terms & Conditions

            </label>


            <button
                type="submit"
                class="btn btn-primary full-width">

                Create Account

            </button>


        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</main>


<script src="js/main.js"></script>

</body>
</html>
